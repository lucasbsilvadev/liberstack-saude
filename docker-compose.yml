version: "3.8"

services:
  liberstack-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: liberstack-fastapi-prod
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env  
    networks:
      - liberstack-network

networks:
  liberstack-network:
    driver: bridge